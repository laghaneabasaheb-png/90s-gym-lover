<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>90s GYM LOVER</title><style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:Arial;padding-bottom:85px}header{padding:15px 20px;background:#090909;border-bottom:1px solid #765600}.logo{color:#f5b916;font-size:28px;font-weight:900}.logo small{display:block;color:#fff;font-size:11px;letter-spacing:4px}.hero{padding:45px 20px;text-align:center;background:radial-gradient(circle at 50% 20%,#3b2b00,#070707 65%)}.kicker{color:#f5b916;font-weight:bold;letter-spacing:5px}h1{font-size:55px;line-height:.9;margin:15px 0}h1 span{display:block;color:#f5b916}.tag{color:#e33;font-size:20px;font-weight:bold;font-style:italic}.player{max-width:430px;margin:30px auto 0;padding:25px 20px;border:1px solid #765600;border-radius:28px;background:#0b0b0bf2}.art{width:190px;height:190px;margin:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#f5b916 0 8%,#151515 9% 45%,#f5b916 46% 48%,#111 49%);font-size:45px;box-shadow:0 0 0 8px #171717}.title{margin-top:25px;font-size:24px;font-weight:bold}.artist{color:#999;margin-top:5px}.progress{height:4px;background:#333;margin:22px 0}.progress span{display:block;width:0;height:100%;background:#f5b916}.times{display:flex;justify-content:space-between;color:#777;font-size:11px}.controls{display:flex;justify-content:center;align-items:center;gap:28px;margin:18px}.c{background:none;border:0;color:#fff;font-size:29px}.main{width:65px;height:65px;border:0;border-radius:50%;background:#f5b916;color:#000;font-size:24px}.vol{color:#aaa}.vol input{width:145px;accent-color:#f5b916}.section{max-width:760px;margin:40px auto;padding:0 20px}.section h2{color:#f5b916}.track{display:flex;gap:13px;align-items:center;padding:15px 8px;border-bottom:1px solid #222;cursor:pointer}.track.active{background:#1d1807;border-left:3px solid #f5b916}.num{width:28px;color:#f5b916}.info{flex:1}.name{font-weight:bold}.by{font-size:12px;color:#777;margin-top:4px}.bottom{position:fixed;bottom:0;left:0;right:0;height:82px;background:#0b0b0bf5;border-top:1px solid #765600;display:flex;align-items:center;padding:8px 12px}.bi{flex:1;min-width:0}.bt{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ba{font-size:12px;color:#777}.bp{width:52px;height:52px;border:0;border-radius:50%;background:#f5b916;color:#000;font-size:20px}@media(max-width:600px){h1{font-size:48px}}</style></head><body>
<header><div class="logo">90s<small>GYM LOVER</small></div></header><section class="hero"><div class="kicker">90s WORKOUT RADIO</div><h1>FEEL THE <span>90s</span></h1><div class="tag">Train Hard. Feel Nostalgic.</div>
<div class="player"><div class="art">🎧</div><div class="title" id="title">Your First 90s Track</div><div class="artist" id="artist">Licensed / owned audio</div><div class="progress"><span id="bar"></span></div><div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div><div class="controls"><button class="c" onclick="prev()">⏮</button><button class="main" id="play" onclick="toggle()">▶</button><button class="c" onclick="next()">⏭</button></div><div class="vol">🔊 <input id="volume" type="range" min="0" max="1" step=".01" value="1"></div><audio id="audio" preload="metadata"></audio></div></section>
<section class="section"><h2>🔥 90s WORKOUT PLAYLIST</h2><div id="list"></div><p style="color:#777;font-size:12px">Add only audio that you own or are licensed to stream.</p></section>
<div class="bottom"><div class="bi"><div class="bt" id="bt">Your First 90s Track</div><div class="ba" id="ba">90s GYM LOVER</div></div><button class="bp" id="bp" onclick="toggle()">▶</button></div>
<script>
const tracks=[{title:"Your First 90s Track",artist:"Add licensed audio",file:""},{title:"90s Power Workout",artist:"Add licensed audio",file:""},{title:"90s Cardio Energy",artist:"Add licensed audio",file:""},{title:"90s Cool Down",artist:"Add licensed audio",file:""}];let i=0,a=document.getElementById("audio");
function render(){list.innerHTML=tracks.map((t,n)=>`<div class="track ${n==i?'active':''}" onclick="selectTrack(${n})"><div class="num">${n+1}</div><div class="info"><div class="name">${t.title}</div><div class="by">${t.artist}</div></div><div>▶</div></div>`).join("")}
function selectTrack(n){i=n;let t=tracks[i];title.textContent=t.title;artist.textContent=t.artist;bt.textContent=t.title;ba.textContent=t.artist;document.querySelectorAll(".track").forEach((x,k)=>x.classList.toggle("active",k==i));a.pause();a.src=t.file||"";play.textContent=bp.textContent="▶"}
function toggle(){if(!a.src){alert("Add a licensed audio file first.");return}a.paused?a.play():a.pause()}
function prev(){selectTrack((i-1+tracks.length)%tracks.length)}function next(){selectTrack((i+1)%tracks.length)}
a.onplay=()=>play.textContent=bp.textContent="❚❚";a.onpause=()=>play.textContent=bp.textContent="▶";a.ontimeupdate=()=>{bar.style.width=(a.duration?a.currentTime/a.duration*100:0)+"%";cur.textContent=fmt(a.currentTime);dur.textContent=fmt(a.duration)};a.onended=next;volume.oninput=e=>a.volume=e.target.value;function fmt(s){return isFinite(s)?Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0"):"0:00"}render();selectTrack(0);
</script></body></html>
